name: Build and Deploy to ECS

on:
  push:
    branches: [non_pro_prod, non_pro_stag]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      # FIX: Construct the full image URI here so other jobs can see it.
      # Append run_number + run_attempt so every workflow run produces a
      # unique tag, even when the same commit is built more than once
      # (ECR repos use immutable tags, so we can never reuse a tag).
      image_tag: ${{ steps.login-ecr.outputs.registry }}/cardcade_${{ github.ref_name }}:${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Use the same naming convention defined in your outputs
          tags: ${{ steps.login-ecr.outputs.registry }}/cardcade_${{ github.ref_name }}:${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}
          provenance: false

  validate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Task Definition
        run: |
          DEPLOY_ENV=${{ github.ref_name }}
          IMAGE_TAG=${{ needs.build.outputs.image_tag }}
          
          # Use '|' as a delimiter because IMAGE_TAG contains '/'
          sed -i "s|<IMAGE_URI>|$IMAGE_TAG|g" .devops/task-def.$DEPLOY_ENV.json
          
          # Register and get the new revision
          aws ecs register-task-definition --cli-input-json file://.devops/task-def.$DEPLOY_ENV.json

      - name: Upload Task Def Artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-definition-${{ github.ref_name }}
          path: .devops/task-def.${{ github.ref_name }}.json

  deploy:
    needs: [build, validate]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
    steps:
      - name: Download Task Def
        uses: actions/download-artifact@v4
        with:
          name: task-definition-${{ github.ref_name }}
          path: .devops/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to ECS
        env:
          CLUSTER: cardcade-clusters
          SERVICE: cardcade-${{ github.ref_name }}
        run: |
          # We don't need to register again; just update the service 
          # to use the latest revision of the family.
          # Note: Ensure the 'family' in your JSON matches your service name or task name.
          aws ecs update-service \
            --cluster $CLUSTER \
            --service $SERVICE \
            --task-definition $SERVICE \
            --force-new-deployment
          
          echo "Waiting for stabilization..."
          aws ecs wait services-stable --cluster $CLUSTER --services $SERVICE
