name: Build and Deploy to ECS

on:
  push:
    branches: [non_pro_prod, non_pro_stag]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.build-image.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: cardcade_${{ github.ref_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "tag=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  validate:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Update Task Definition
        run: |
          DEPLOY_ENV=${{ github.ref_name }}
          IMAGE_TAG=${{ needs.build.outputs.image_tag }}
          sed -i "s|<IMAGE_URI>|$IMAGE_TAG|g" .devops/task-def.$DEPLOY_ENV.json
          aws ecs register-task-definition --cli-input-json file://.devops/task-def.$DEPLOY_ENV.json

      - name: Upload Task Def Artifact
        uses: actions/upload-artifact@v4
        with:
          name: task-definition-${{ github.ref_name }}
          path: .devops/task-def.${{ github.ref_name }}.json

  deploy:
    needs: [build, validate]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name }}
    # Manual trigger for prod via Environment Protection Rules in GitHub UI
    steps:
      - name: Download Task Def
        uses: actions/download-artifact@v4
        with:
          name: task-definition-${{ github.ref_name }}
          path: .devops/

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Deploy to ECS
        env:
          # Mapping names as per your GitLab logic
          CLUSTER: cardcade-clusters
          SERVICE: cardcade-${{ github.ref_name }}
        run: |
          aws ecs register-task-definition --cli-input-json file://.devops/task-def.${{ github.ref_name }}.json
          aws ecs update-service --cluster $CLUSTER --service $SERVICE --task-definition $SERVICE --desired-count 1
          echo "Waiting for stabilization..."
          aws ecs wait services-stable --cluster $CLUSTER --services $SERVICE
